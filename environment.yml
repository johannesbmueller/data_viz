name: viz_env
channels:
  - conda-forge
dependencies:
  - python=3.12
  # Notebook / editor support
  - jupyter
  - ipykernel
  # Core data + visualization stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  # NOTE: plotly, pillow and dash are intentionally NOT listed here.
  # Students install these manually from the command line during the course
  # (e.g. `mamba install plotly`) so they learn what a package manager does
  # and how to react to a ModuleNotFoundError.
